name: dozzle

services:
  # optional but helpful log viewer
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    container_name: dozzle
    env_file:
      - dozzle.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ___REPLACE_ME_DOZZLE_ROOT_PATH___/data:/data
    ports:
      - "10010:8888"