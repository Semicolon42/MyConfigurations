services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    network_mode: host
    environment:
      - TZ=America/Los_Angeles
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # network_mode: host is required for accurate interface stats, which
    # also means it physically can't join `edge` — LAN-only.
