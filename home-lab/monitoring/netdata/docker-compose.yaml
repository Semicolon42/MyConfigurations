name: netdata

services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: netdata
    ports:
      - "10011:19999"
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ___REPLACE_ME_NETDATA_ROOT_PATH___/config:/etc/netdata
      - ___REPLACE_ME_NETDATA_ROOT_PATH___/lib:/var/lib/netdata
      - ___REPLACE_ME_NETDATA_ROOT_PATH___/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    # LAN-only by design — system metrics should never be internet-reachable.
    # Netdata >=2.1.1 puts a sign-in/Netdata-Cloud nag on the dashboard root.
    # No data leaves the box (NETDATA_CLAIM_TOKEN is never set here) — it's
    # just a UI gate. Bypass it by going straight to http://host:19999/v3
    # (legacy local dashboard, no account needed). No env var disables the
    # nag on the root path as of this writing.
