services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: netdata
    ports:
      - "19999:19999"
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ___REPLACE_ME_NETDATA_CONFIG_PATH___:/etc/netdata
      - ___REPLACE_ME_NETDATA_LIB_PATH___:/var/lib/netdata
      - ___REPLACE_ME_NETDATA_CACHE_PATH___:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    # LAN-only by design — system metrics should never be internet-reachable.
