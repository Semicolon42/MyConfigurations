name: scrutiny

services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    ports:
      - "10012:8080"
      - "10013:8086"
    volumes:
      - ___REPLACE_ME_SCRUTINY_ROOT_PATH___/config:/opt/scrutiny/config
      - ___REPLACE_ME_SCRUTINY_ROOT_PATH___/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - "___REPLACE_ME_DISK_DEVICE_1___:___REPLACE_ME_DISK_DEVICE_1___"
      - "___REPLACE_ME_DISK_DEVICE_2___:___REPLACE_ME_DISK_DEVICE_2___"
    restart: unless-stopped
    # Needs raw disk access (see `devices:` — adjust to your actual drives).
    # LAN-only, same reasoning as netdata.
