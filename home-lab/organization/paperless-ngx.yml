name: paperless

services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - ___REPLACE_ME_PAPERLESS_REDIS_DATA_PATH___:/data

  # postgres database for paperless-ngx
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres
    env_file:
      - paperless-ngx.env
    volumes:
      - ___REPLACE_ME_PAPERLESS_DATA_PATH___:/var/lib/postgresql

  # gotenberg service that paperless uses for document conversion
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    container_name: gotenberg
    env_file:
      - paperless-ngx.env
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  
  # tika service that paperless uses for document text extraction
  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    restart: unless-stopped
    env_file:
      - paperless-ngx.env

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - "40002:8000"
    env_file:
      - paperless-ngx.env
    volumes:
      - ___REPLACE_ME_PAPERLESS_DATA_PATH___:/usr/src/paperless/data
      - ___REPLACE_ME_PAPERLESS_MEDIA_PATH___:/usr/src/paperless/media
      - ___REPLACE_ME_PAPERLESS_EXPORT_PATH___:/usr/src/paperless/export
      - ___REPLACE_ME_PAPERLESS_CONSUME_PATH___:/usr/src/paperless/consume
    networks:
      - default
      - edge


  # paperless-ai service
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    restart: unless-stopped
    depends_on:
      - paperless-ngx
    ports:
      - "40003:3000"
    env_file:
      - paperless-ngx.env
    volumes:
      - __PAPERLESS_AI__/data:/app/data
    networks:
      - default
      - internal-llm
    # LAN-only for now — add to `edge` + a Caddyfile block if you want this
    # reachable outside the LAN.

  # paperless-gpt service
  paperless-gpt:
    image: icereed/paperless-gpt:latest
    container_name: paperless-gpt
    restart: unless-stopped
    depends_on:
      - paperless-ngx
    ports:
      - "40004:8080"
    env_file:
      - paperless-ngx.env
    volumes:
      - __PAPERLESS_GPT__/prompts:/app/prompts # Mount the prompts directory
    networks:
      - default
      - internal-llm
    # LAN-only for now — add to `edge` + a Caddyfile block if you want this
    # reachable outside the LAN.

networks:
  edge:
    external: true
  internal-llm:
    external: true
    # Shared network for reaching Ollama (ai/ollama.yml) without merging
    # compose projects — see the comment there for the full explanation.
  # `broker` and `postgres` stay on the compose-local `default` network only
  # — they never need to be reachable from `edge`/Cloudflare or `internal-llm`,
  # just from paperless-ngx.
