services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=<<REPLACE_WITH_REAL_POSTGRES_PASSWORD>>
    restart: always
    volumes:
      - ___REPLACE_ME_LINKWARDEN_PGDATA_PATH___:/var/lib/postgresql/data
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: always
    volumes:
      - ___REPLACE_ME_LINKWARDEN_MEILI_DATA_PATH___:/meili_data
  linkwarden:
    environment:
      - NEXTAUTH_URL=http://localhost:3000/api/v1/auth
      - NEXTAUTH_SECRET=<<REPLACE_WITH_REAL_NEXTAUTH_SECRET>>
      # Must match POSTGRES_PASSWORD above exactly.
      - DATABASE_URL=postgresql://postgres:<<REPLACE_WITH_REAL_POSTGRES_PASSWORD>>@postgres:5432/postgres
    restart: always
    # build: . # uncomment to build from source
    image: ghcr.io/linkwarden/linkwarden:latest # comment to build from source
    ports:
      - 3000:3000
    volumes:
      - ___REPLACE_ME_LINKWARDEN_DATA_PATH___:/data/data
    depends_on:
      - postgres
      - meilisearch
    networks:
      - default
      - edge

networks:
  edge:
    external: true
  # postgres and meilisearch stay on the compose-local `default` network only —
  # they're never added to `edge`, so the tunnel container can never reach them.