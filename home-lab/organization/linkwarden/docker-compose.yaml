name: linkwarden

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - link-warden.env
    restart: always
    volumes:
      - ___REPLACE_ME_LINKWARDEN_ROOT_PATH___/pgdata:/var/lib/postgresql/data
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: always
    volumes:
      - ___REPLACE_ME_LINKWARDEN_ROOT_PATH___/meili_data:/meili_data
  linkwarden:
    env_file:
      - link-warden.env
    restart: always
    # build: . # uncomment to build from source
    image: ghcr.io/linkwarden/linkwarden:latest # comment to build from source
    ports:
      - 20010:3000
    volumes:
      - ___REPLACE_ME_LINKWARDEN_ROOT_PATH___/data:/data/data
    depends_on:
      - postgres
      - meilisearch
    networks:
      - default
      - edge

networks:
  edge:
    external: true
  # postgres and meilisearch stay on the compose-local `default` network only —
  # they're never added to `edge`, so the tunnel container can never reach them.