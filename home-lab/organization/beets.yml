services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000
    volumes:
      - ___REPLACE_ME_BEETS_CONFIG_PATH___:/config
      - ___REPLACE_ME_MUSIC_DOWNLOADS_PATH___:/downloads
      - ___REPLACE_ME_MUSIC_LIBRARY_PATH___:/music
    restart: unless-stopped
    # CLI-driven (`docker exec beets beet import /downloads`), no web UI —
    # stays off `edge` entirely.
