name: paperless

services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless-broker
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["redis-server"]
    volumes:
      - ___REPLACE_ME_PAPERLESS_REDIS_DATA_PATH___:/data

  # postgres database for paperless-ngx
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres
    env_file:
      - paperless-ngx.env
    volumes:
      - ___REPLACE_ME_PAPERLESS_DATA_PATH___:/var/lib/postgresql

  # gotenberg service that paperless uses for document conversion
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    container_name: gotenberg
    env_file:
      - paperless-ngx.env
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  # tika service that paperless uses for document text extraction
  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    restart: unless-stopped
    env_file:
      - paperless-ngx.env

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - "20011:8000"
    env_file:
      - paperless-ngx.env
    volumes:
      - ___REPLACE_ME_PAPERLESS_DATA_PATH___:/usr/src/paperless/data
      - ___REPLACE_ME_PAPERLESS_MEDIA_PATH___:/usr/src/paperless/media
      - ___REPLACE_ME_PAPERLESS_EXPORT_PATH___:/usr/src/paperless/export
      - ___REPLACE_ME_PAPERLESS_CONSUME_PATH___:/usr/src/paperless/consume
    networks:
      - default
      - edge

  # paperless-ngx-dedupe: finds/removes duplicate documents in paperless-ngx
  # (MinHash/LSH fuzzy matching, catches near-duplicates exact hashing misses)
  paperless-ngx-dedupe:
    image: ghcr.io/rknightion/paperless-ngx-dedupe:latest
    container_name: paperless-ngx-dedupe
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - paperless-ngx
    ports:
      - "20012:3000"
    env_file:
      - paperless-ngx.env
    volumes:
      - ___REPLACE_ME_PAPERLESS_DEDUPE_DATA_PATH___:/app/data
    networks:
      - default
      - edge
    # Reachable externally at docs-dd.semicolon42.com — see
    # connection/caddy/Caddyfile.

networks:
  edge:
    external: true
  # `broker` and `postgres` stay on the compose-local `default` network only
  # — they never need to be reachable from `edge`/Cloudflare or `internal-llm`,
  # just from paperless-ngx.
