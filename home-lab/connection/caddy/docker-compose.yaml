name: proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    networks:
      - edge
    volumes:
      - ___REPLACE_ME_CADDYFILE_PATH___:/etc/caddy/Caddyfile:ro
      - ___REPLACE_ME_CADDY_ROOT_PATH___/data:/data
      - ___REPLACE_ME_CADDY_ROOT_PATH___/config:/config
    # No `ports:` published to the host on purpose — the only thing that
    # ever needs to reach Caddy is `cloudflared`, over the `edge` network.
    # If you also want LAN clients to hit these hostnames directly without
    # going through Cloudflare, the NAS already owns host ports 80/443
    # (DSM), so publish something like "10020:80" here instead (1002X is
    # the connection range) and point your LAN DNS (Pi-hole/router) at
    # <nas-ip>:10020 for those hostnames.

networks:
  edge:
    external: true
