name: kavita

services:

  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    env_file:
      - kavita.env
    ports:
      - "20003:5000"
    volumes:
      - ___REPLACE_ME_KAVITA_ROOT_PATH___/config:/kavita/config
      - ___REPLACE_ME_KAVITA_MANGA_PATH___:/manga
      - ___REPLACE_ME_KAVITA_COMICS_PATH___:/comics
      - ___REPLACE_ME_KAVITA_BOOKS_PATH___:/books
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    external: true