name: immich

services:
  redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    env_file:
      - immich.env
    volumes:
      - ___REPLACE_ME_IMMICH_DB_DATA_PATH___:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready || exit 1"]

  # CLIP-based smart search / face recognition / object detection.
  # CPU-only by design here — no GPU reservation. Note: this is NOT Ollama;
  # Immich has no native Ollama/LLM provider, this runs its own ONNX CLIP
  # models. See ai/ollama.yml if that changes later (a captioning sidecar
  # like immich-analyze could join `internal-llm` the same way paperless-gpt
  # does, calling both this stack's API and Ollama's — deliberately skipped
  # for now).
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - ___REPLACE_ME_IMMICH_ML_CACHE_PATH___:/cache

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    ports:
      - "30006:2283"
    env_file:
      - immich.env
    volumes:
      - ___REPLACE_ME_IMMICH_UPLOAD_PATH___:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - edge
    # Reachable at pics.semicolon42.com via Caddy/Cloudflare — see
    # connection/Caddyfile. redis/database/immich-machine-learning stay on
    # `default` only, same reasoning as every other stack in this repo.

networks:
  edge:
    external: true
