name: plex

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    env_file:
      - plex-local-only.env
    ports:
      - "32400:32400"
    volumes:
      - ___REPLACE_ME_PLEX_ROOT_PATH___/config:/config
      - ___REPLACE_ME_MOVIES_LIBRARY_PATH___:/media/movies:ro
      - ___REPLACE_ME_TV_LIBRARY_PATH___:/media/tv:ro
    restart: unless-stopped
    # Intentionally NOT on the `edge` network and no other host is punched
    # through Cloudflare for this one — LAN/PS5 only, per the filename.
    # Port stays 32400:32400, not the 2000X media pattern — Plex's LAN
    # auto-discovery (GDM), which the PS5 app depends on, only works on
    # the standard port.
