name: stash

services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    env_file:
      - stash.env
    ports:
      - "30005:9999"
    volumes:
      - ___REPLACE_ME_STASH_CONFIG_PATH___:/root/.stash
      - ___REPLACE_ME_STASH_LIBRARY_PATH___:/data
      - ___REPLACE_ME_STASH_GENERATED_PATH___:/generated
      - ___REPLACE_ME_STASH_METADATA_PATH___:/metadata
      - ___REPLACE_ME_STASH_CACHE_PATH___:/cache
    restart: unless-stopped
    # Kept off `edge` on purpose — sensitive library, LAN-only unless you
    # deliberately decide otherwise later.
