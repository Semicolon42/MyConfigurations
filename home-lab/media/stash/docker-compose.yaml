name: stash

services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    env_file:
      - stash.env
    ports:
      - "20004:9999"
    volumes:
      - ___REPLACE_ME_STASH_ROOT_PATH___/config:/root/.stash
      - ___REPLACE_ME_STASH_LIBRARY_PATH___:/data
      - ___REPLACE_ME_STASH_ROOT_PATH___/generated:/generated
      - ___REPLACE_ME_STASH_ROOT_PATH___/metadata:/metadata
      - ___REPLACE_ME_STASH_ROOT_PATH___/cache:/cache
    restart: unless-stopped
    # Kept off `edge` on purpose — sensitive library, LAN-only unless you
    # deliberately decide otherwise later.
