name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - homepage.env
    ports:
      - "10000:3000"
    volumes:
      - ___REPLACE_ME_HOMEPAGE_CONFIG_PATH___:/app/config
      - ./services.yaml:/app/config/services.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # LAN-only by design (like monitoring/*, per PLANNING.md) — this page
    # is a directory of every hostname and admin surface in the lab, so it
    # doesn't join `edge` and isn't in the Caddyfile. If you want it public
    # later, add it deliberately rather than by default.
    #
    # services.yaml is tracked in this repo and bind-mounted on top of the
    # REPLACE_ME config dir, so the app links live in git; everything else
    # Homepage writes at runtime (settings.yaml, bookmarks.yaml, etc.) stays
    # on the host only. Fill in ___REPLACE_ME_LAN_HOST___ in services.yaml
    # with your actual LAN hostname/IP.
