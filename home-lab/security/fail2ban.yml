name: fail2ban

services:
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - fail2ban.env
    volumes:
      - ___REPLACE_ME_FAIL2BAN_DATA_PATH___:/data
      - ___REPLACE_ME_LOG_SOURCE_PATH___:/var/log/remote:ro # point at whatever logs you want it watching
    restart: unless-stopped
    # Needs host networking + NET_ADMIN to manipulate iptables directly —
    # can't be sandboxed onto an app network like the others.
